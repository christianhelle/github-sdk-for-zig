name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, matching build.zig.zon (for example 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Check the version matches build.zig.zon
        run: grep -qF ".version = \"$VERSION\"" build.zig.zon

      - name: Test
        run: zig build test

      - name: Compile every generated operation
        run: zig build check

      - name: Build examples
        run: zig build examples

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
